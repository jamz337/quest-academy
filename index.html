<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#1d2b53" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <title>Quest Academy</title>
    <style>
      @font-face { font-family: 'Fredoka'; font-style: normal; font-weight: 400 700; font-display: swap; src: url('./fonts/fredoka-latin.woff2') format('woff2'); }
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #1d2b53; overflow: hidden; }
      body { --sat: env(safe-area-inset-top); --sab: env(safe-area-inset-bottom); --sal: env(safe-area-inset-left); --sar: env(safe-area-inset-right); touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none;
             -webkit-tap-highlight-color: transparent; font-family: system-ui, sans-serif; }
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; }
      #update-toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #fff;
        color: #1d2b53; padding: 10px 16px; border-radius: 12px; font-weight: 700; display: none; z-index: 10;
        box-shadow: 0 4px 16px rgba(0,0,0,.35); }
      #update-toast button { margin-left: 12px; border: 0; background: #29adff; color: #fff; padding: 6px 12px;
        border-radius: 8px; font-weight: 700; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="update-toast">Update ready <button id="update-btn">Reload</button></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
